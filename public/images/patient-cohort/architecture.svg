<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 920" width="1600" height="920" font-family="Inter, system-ui, sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#00d4b4"/></marker>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#93a39f"/></marker>
    <marker id="o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#f59e0b"/></marker>
  </defs>
  <rect width="1600" height="920" fill="#0a0f0e"/>

  <text x="52" y="84" font-family="Anton, Impact, sans-serif" font-size="56" fill="#eef4f2" letter-spacing="1">HOW THE PATIENT COHORT BUILDER WORKS</text>
  <text x="52" y="124" font-size="20" fill="#93a39f">Two ways in, one locked-down database. AI-written SQL is checked twice before it runs.</text>

  <!-- side branches from LLM -->
  <g font-size="16">
    <rect x="364" y="170" width="248" height="56" rx="10" fill="#121917" stroke="#26312e"/>
    <text x="384" y="196" fill="#eef4f2" font-weight="600">Too vague?</text>
    <text x="384" y="216" fill="#93a39f">Asks a clarifying question</text>
    <rect x="676" y="170" width="300" height="56" rx="10" fill="#121917" stroke="#26312e"/>
    <text x="696" y="196" fill="#eef4f2" font-weight="600">Not a cohort question?</text>
    <text x="696" y="216" fill="#93a39f">Explains what it can do</text>
    <path d="M488 300 V232" stroke="#93a39f" stroke-width="2" stroke-dasharray="6 6" fill="none" marker-end="url(#g)"/>
    <path d="M560 300 C 600 260, 680 260, 720 232" stroke="#93a39f" stroke-width="2" stroke-dasharray="6 6" fill="none" marker-end="url(#g)"/>
  </g>

  <!-- lane label -->
  <text x="52" y="282" font-family="'IBM Plex Mono', monospace" font-size="14" fill="#00d4b4" letter-spacing="2">AI MODE · ASK IN PLAIN ENGLISH</text>

  <!-- main row boxes -->
  <g>
    <rect x="52" y="300" width="248" height="190" rx="14" fill="#121917" stroke="#26312e" stroke-width="2"/>
    <text x="72" y="336" font-family="'IBM Plex Mono', monospace" font-size="14" fill="#93a39f">01 · INPUT</text>
    <text x="72" y="372" font-size="24" font-weight="700" fill="#eef4f2">Question</text>
    <text x="72" y="404" font-size="16" fill="#93a39f">“Diabetic women over 50</text>
    <text x="72" y="426" font-size="16" fill="#93a39f">with an HbA1c above 8”</text>
    <text x="72" y="466" font-size="14" fill="#93a39f">Rate limited: 15 / visitor / hr</text>

    <rect x="364" y="300" width="248" height="190" rx="14" fill="#121917" stroke="#26312e" stroke-width="2"/>
    <text x="384" y="336" font-family="'IBM Plex Mono', monospace" font-size="14" fill="#93a39f">02 · LLM</text>
    <text x="384" y="372" font-size="24" font-weight="700" fill="#eef4f2">Writes SQL</text>
    <text x="384" y="404" font-size="16" fill="#93a39f">+ assumptions, as JSON</text>
    <text x="384" y="436" font-size="14" fill="#93a39f">Grounded in the schema,</text>
    <text x="384" y="456" font-size="14" fill="#93a39f">clinical rules, 3 examples</text>
    <text x="384" y="476" font-size="14" fill="#93a39f">Gemini free tier · Groq · Ollama</text>

    <rect x="676" y="300" width="248" height="190" rx="14" fill="#0d2b26" stroke="#00d4b4" stroke-width="2"/>
    <text x="696" y="336" font-family="'IBM Plex Mono', monospace" font-size="14" fill="#00d4b4">03 · SAFETY LAYER 1</text>
    <text x="696" y="372" font-size="24" font-weight="700" fill="#eef4f2">Guardrails</text>
    <text x="696" y="404" font-size="16" fill="#eef4f2">SELECT and CTEs only</text>
    <text x="696" y="436" font-size="14" fill="#93a39f">Blocks DROP, DELETE,</text>
    <text x="696" y="456" font-size="14" fill="#93a39f">stacked statements and</text>
    <text x="696" y="476" font-size="14" fill="#93a39f">unknown tables</text>

    <rect x="988" y="300" width="248" height="190" rx="14" fill="#0d2b26" stroke="#00d4b4" stroke-width="2"/>
    <text x="1008" y="336" font-family="'IBM Plex Mono', monospace" font-size="14" fill="#00d4b4">04 · SAFETY LAYER 2</text>
    <text x="1008" y="372" font-size="24" font-weight="700" fill="#eef4f2">Read-only SQLite</text>
    <text x="1008" y="404" font-size="16" fill="#eef4f2">Authorizer allows reads</text>
    <text x="1008" y="426" font-size="16" fill="#eef4f2">from 4 known tables only</text>
    <text x="1008" y="456" font-size="14" fill="#93a39f">5-second timeout</text>
    <text x="1008" y="476" font-size="14" fill="#93a39f">50,000-row cap, with a warning</text>

    <rect x="1300" y="300" width="248" height="190" rx="14" fill="#121917" stroke="#26312e" stroke-width="2"/>
    <text x="1320" y="336" font-family="'IBM Plex Mono', monospace" font-size="14" fill="#93a39f">05 · OUTPUT</text>
    <text x="1320" y="372" font-size="24" font-weight="700" fill="#eef4f2">Dashboard</text>
    <text x="1320" y="404" font-size="16" fill="#93a39f">KPI tiles, 3 charts,</text>
    <text x="1320" y="426" font-size="16" fill="#93a39f">patient table, CSV</text>
    <text x="1320" y="456" font-size="14" fill="#93a39f">Assumption chips and</text>
    <text x="1320" y="476" font-size="14" fill="#93a39f">“Show the SQL”</text>
  </g>

  <!-- main arrows -->
  <g stroke="#00d4b4" stroke-width="3" fill="none">
    <path d="M300 395 H356" marker-end="url(#a)"/>
    <path d="M612 395 H668" marker-end="url(#a)"/>
    <path d="M924 395 H980" marker-end="url(#a)"/>
    <path d="M1236 395 H1292" marker-end="url(#a)"/>
  </g>

  <!-- retry loop -->
  <path d="M1060 490 V560 H488 V498" stroke="#f59e0b" stroke-width="3" fill="none" stroke-dasharray="10 8" marker-end="url(#o)"/>
  <rect x="640" y="540" width="320" height="40" rx="20" fill="#0a0f0e" stroke="#f59e0b" stroke-width="2"/>
  <text x="800" y="566" text-anchor="middle" font-size="16" font-weight="600" fill="#f59e0b">Error fed back · up to 3 tries</text>

  <!-- no-AI lane -->
  <line x1="52" y1="640" x2="1548" y2="640" stroke="#26312e" stroke-width="2"/>
  <text x="52" y="690" font-family="'IBM Plex Mono', monospace" font-size="14" fill="#00d4b4" letter-spacing="2">NO-AI MODE · CHOOSE FILTERS · WORKS WITHOUT AN API KEY</text>

  <rect x="52" y="710" width="248" height="150" rx="14" fill="#121917" stroke="#26312e" stroke-width="2"/>
  <text x="72" y="746" font-family="'IBM Plex Mono', monospace" font-size="14" fill="#93a39f">01 · INPUT</text>
  <text x="72" y="782" font-size="24" font-weight="700" fill="#eef4f2">Filters</text>
  <text x="72" y="814" font-size="16" fill="#93a39f">Sex, age, city, conditions,</text>
  <text x="72" y="836" font-size="16" fill="#93a39f">medications, HbA1c, BMI</text>

  <rect x="364" y="710" width="560" height="150" rx="14" fill="#121917" stroke="#26312e" stroke-width="2"/>
  <text x="384" y="746" font-family="'IBM Plex Mono', monospace" font-size="14" fill="#93a39f">02 · BUILDER</text>
  <text x="384" y="782" font-size="24" font-weight="700" fill="#eef4f2">Parameterised SQL</text>
  <text x="384" y="814" font-size="16" fill="#93a39f">Built directly from the filters. No model, no quota,</text>
  <text x="384" y="836" font-size="16" fill="#93a39f">so the public demo always has a working fallback.</text>

  <g stroke="#00d4b4" stroke-width="3" fill="none">
    <path d="M300 785 H356" marker-end="url(#a)"/>
    <path d="M924 785 H1172 V498" marker-end="url(#a)"/>
  </g>

  <!-- footer -->
  <text x="1548" y="900" text-anchor="end" font-size="14" fill="#93a39f">800 synthetic patients · SNOMED-CT, LOINC, RxNorm codes · No real patient data</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
